function start(){let b=$("shuf").checked?sh(BANK):BANK.slice();Q=b.slice(0,+$("num").value).map(q=>{if(!$("shuf").checked)return q;const idx=sh([0,1,2,3]);return{q:q.q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}});i=0;score=0;ans=[];t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);tick();show("quiz");render()}
function tick(){const s=(Date.now()-t0)/1000|0;$("tm").textContent=String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function render(){const q=Q[i];$("pos").textContent="வினா "+(i+1)+" / "+Q.length;$("pb").style.width=(i/Q.length*100)+"%";$("qt").textContent=q.q;$("next").disabled=true;$("next").textContent=i===Q.length-1?"முடிவு":"அடுத்து";const o=$("opts");o.innerHTML="";q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.textContent="ABCD"[k]+". "+t;b.onclick=()=>pick(k);o.appendChild(b)})}
function pick(k){const q=Q[i];ans[i]=k;if(k===q.a)score++;[...$("opts").children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("ok");else if(j===k)b.classList.add("no")});$("next").disabled=false}
function end(){clearInterval(timer);$("sc").textContent=score+" / "+Q.length;const p=Math.round(score/Q.length*100);$("sm").textContent=p+"% · நேரம் "+$("tm").textContent;$("rv").innerHTML="";Q.forEach((q,k)=>{const d=document.createElement("div");d.className="rv";const ok=ans[k]===q.a;const b=document.createElement("b");b.className=ok?"ok":"no";b.textContent=(k+1)+". "+(ok?"சரி":"தவறு");const s=document.createElement("div");s.textContent=q.q;const c=document.createElement("div");c.style.color="var(--mute)";c.textContent="சரியான விடை: "+"ABCD"[q.a]+". "+q.o[q.a]+(ok||ans[k]==null?"":" (உங்கள் விடை: "+"ABCD"[ans[k]]+". "+q.o[ans[k]]+")");d.append(b,s,c);$("rv").appendChild(d)});show("res")}
$("go").onclick=start;$("again").onclick=()=>show("start");
$("next").onclick=()=>{if(i<Q.length-1){i++;render()}else end()};
$("quit").onclick=()=>{if(confirm("தேர்வை முடிக்கவா?")){Q=Q.slice(0,Math.max(1,i+(ans[i]!=null?1:0)));end()}};
$("add").onclick=()=>{try{const d=JSON.parse($("json").value);if(!Array.isArray(d))throw 0;const ok=d.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length===4&&x.a>=0&&x.a<4);BANK.push(...ok);fill();$("msg").textContent=ok.length+" added";$("json").value=""}catch(e){$("msg").textContent="Invalid JSON"}};
