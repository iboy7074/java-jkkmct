<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e3e6ee;--acc:#e8590c;--acc2:#1971c2;--term:#0f1722;--termink:#b8f5c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#181e29;--ink:#eef1f7;--mute:#98a2b3;--line:#283042;--acc:#ff922b;--acc2:#74c0fc;--term:#070b11;--termink:#9be9ac}}
:root[data-theme="dark"]{--bg:#10141c;--card:#181e29;--ink:#eef1f7;--mute:#98a2b3;--line:#283042;--acc:#ff922b;--acc2:#74c0fc;--term:#070b11;--termink:#9be9ac}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:28px 18px 18px;max-width:900px;margin:auto}
h1{margin:0 0 6px;font-size:26px}
header p{margin:0;color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
input[type=search]{flex:1;min-width:180px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.run{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
main{max-width:900px;margin:auto;padding:0 18px 60px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.top{display:flex;gap:12px;align-items:flex-start}
.num{min-width:38px;height:38px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center}
.meta{flex:1;min-width:0}
.meta b{display:block}
.meta code{color:var(--mute);font-size:13px;word-break:break-all}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;color:var(--mute);margin-left:6px;white-space:nowrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
pre{margin:12px 0 0;padding:12px;border-radius:10px;overflow-x:auto;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre}
pre.code{background:var(--bg);border:1px solid var(--line)}
pre.term{background:var(--term);color:var(--termink)}
.note{font-size:12px;color:var(--mute);margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c2230;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:90%}
.toast.on{opacity:1}
.hide{display:none}
</style>

<script>
const FILES = [{"n": 1, "file": "Q01_Student.java", "cls": "Q01_Student", "title": "Student class - default & parameterized constructors", "tag": "Console", "code": "// Q1: Student class with default and parameterized constructors\nclass Student {\n    int id;\n    String name;\n    String course;\n    double marks;\n\n    // Default constructor\n    Student() {\n        id = 0;\n        name = \"Not Assigned\";\n        course = \"Not Assigned\";\n        marks = 0.0;\n    }\n\n    // Parameterized constructor\n    Student(int id, String name, String course, double marks) {\n        this.id = id;\n        this.name = name;\n        this.course = course;\n        this.marks = marks;\n    }\n\n    void display() {\n        System.out.println(\"ID     : \" + id);\n        System.out.println(\"Name   : \" + name);\n        System.out.println(\"Course : \" + course);\n        System.out.println(\"Marks  : \" + marks);\n        System.out.println(\"---------------------\");\n    }\n}\n\npublic class Q01_Student {\n    public static void main(String[] args) {\n        Student s1 = new Student();\n        Student s2 = new Student(101, \"Arun\", \"B.Sc Computer Science\", 86.5);\n        System.out.println(\"Student using default constructor:\");\n        s1.display();\n        System.out.println(\"Student using parameterized constructor:\");\n        s2.display();\n    }\n}\n", "out": "Student using default constructor:\nID     : 0\nName   : Not Assigned\nCourse : Not Assigned\nMarks  : 0.0\n---------------------\nStudent using parameterized constructor:\nID     : 101\nName   : Arun\nCourse : B.Sc Computer Science\nMarks  : 86.5\n---------------------"}, {"n": 2, "file": "Q02_MultilevelInheritance.java", "cls": "Q02_MultilevelInheritance", "title": "Multilevel inheritance (Person, Student, Result)", "tag": "Console", "code": "// Q2: Multilevel inheritance - Person -> Student -> Result\nclass Person {\n    String name;\n    int age;\n\n    Person(String name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\n    void showPerson() {\n        System.out.println(\"Name : \" + name);\n        System.out.println(\"Age  : \" + age);\n    }\n}\n\nclass StudentInfo extends Person {\n    int rollNo;\n    String course;\n\n    StudentInfo(String name, int age, int rollNo, String course) {\n        super(name, age);\n        this.rollNo = rollNo;\n        this.course = course;\n    }\n\n    void showStudent() {\n        showPerson();\n        System.out.println(\"Roll : \" + rollNo);\n        System.out.println(\"Course : \" + course);\n    }\n}\n\nclass Result extends StudentInfo {\n    int m1, m2, m3;\n\n    Result(String name, int age, int rollNo, String course, int m1, int m2, int m3) {\n        super(name, age, rollNo, course);\n        this.m1 = m1;\n        this.m2 = m2;\n        this.m3 = m3;\n    }\n\n    void showResult() {\n        showStudent();\n        int total = m1 + m2 + m3;\n        double avg = total / 3.0;\n        System.out.println(\"Marks : \" + m1 + \", \" + m2 + \", \" + m3);\n        System.out.println(\"Total : \" + total);\n        System.out.printf(\"Average : %.2f%n\", avg);\n        System.out.println(\"Result : \" + (m1 >= 40 && m2 >= 40 && m3 >= 40 ? \"PASS\" : \"FAIL\"));\n    }\n}\n\npublic class Q02_MultilevelInheritance {\n    public static void main(String[] args) {\n        Result r = new Result(\"Meena\", 20, 12, \"BCA\", 78, 65, 82);\n        r.showResult();\n    }\n}\n", "out": "Name : Meena\nAge  : 20\nRoll : 12\nCourse : BCA\nMarks : 78, 65, 82\nTotal : 225\nAverage : 75.00\nResult : PASS"}, {"n": 3, "file": "Q03_ShapeInterface.java", "cls": "Q03_ShapeInterface", "title": "Shape interface - area of shapes", "tag": "Console", "code": "// Q3: Interface Shape implemented by Circle, Rectangle, Triangle\ninterface Shape {\n    double area();\n}\n\nclass Circle implements Shape {\n    double r;\n    Circle(double r) { this.r = r; }\n    public double area() { return Math.PI * r * r; }\n}\n\nclass Rectangle implements Shape {\n    double l, b;\n    Rectangle(double l, double b) { this.l = l; this.b = b; }\n    public double area() { return l * b; }\n}\n\nclass Triangle implements Shape {\n    double base, height;\n    Triangle(double base, double height) { this.base = base; this.height = height; }\n    public double area() { return 0.5 * base * height; }\n}\n\npublic class Q03_ShapeInterface {\n    public static void main(String[] args) {\n        Shape[] shapes = { new Circle(5), new Rectangle(4, 6), new Triangle(3, 8) };\n        String[] names = { \"Circle\", \"Rectangle\", \"Triangle\" };\n        for (int i = 0; i < shapes.length; i++) {\n            System.out.printf(\"Area of %s = %.2f%n\", names[i], shapes[i].area());\n        }\n    }\n}\n", "out": "Area of Circle = 78.54\nArea of Rectangle = 24.00\nArea of Triangle = 12.00"}, {"n": 4, "file": "Q04_TicketBooking.java", "cls": "Q04_TicketBooking", "title": "Multithreaded ticket booking (synchronization)", "tag": "Console", "code": "// Q4: Multithreaded ticket booking with synchronization\nclass TicketCounter {\n    private int availableTickets;\n\n    TicketCounter(int tickets) { availableTickets = tickets; }\n\n    // synchronized prevents two threads booking the same ticket\n    public synchronized void book(String customer, int count) {\n        System.out.println(customer + \" is trying to book \" + count + \" ticket(s)\");\n        if (count <= availableTickets) {\n            try { Thread.sleep(100); } catch (InterruptedException e) { }\n            availableTickets -= count;\n            System.out.println(\"  SUCCESS: \" + customer + \" booked \" + count\n                    + \". Remaining = \" + availableTickets);\n        } else {\n            System.out.println(\"  FAILED : \" + customer + \" - only \"\n                    + availableTickets + \" ticket(s) left\");\n        }\n    }\n}\n\nclass Customer extends Thread {\n    TicketCounter counter;\n    int count;\n\n    Customer(TicketCounter counter, String name, int count) {\n        super(name);\n        this.counter = counter;\n        this.count = count;\n    }\n\n    public void run() {\n        counter.book(getName(), count);\n    }\n}\n\npublic class Q04_TicketBooking {\n    public static void main(String[] args) {\n        TicketCounter counter = new TicketCounter(10);\n        Customer c1 = new Customer(counter, \"Anu\", 4);\n        Customer c2 = new Customer(counter, \"Babu\", 5);\n        Customer c3 = new Customer(counter, \"Charan\", 3);\n        c1.start();\n        c2.start();\n        c3.start();\n    }\n}\n", "out": "Anu is trying to book 4 ticket(s)\n  SUCCESS: Anu booked 4. Remaining = 6\nCharan is trying to book 3 ticket(s)\n  SUCCESS: Charan booked 3. Remaining = 3\nBabu is trying to book 5 ticket(s)\n  FAILED : Babu - only 3 ticket(s) left\n(order of customers can vary between runs)"}, {"n": 5, "file": "Q05_RunnableThreads.java", "cls": "Q05_RunnableThreads", "title": "Multiple threads using Runnable", "tag": "Console", "code": "// Q5: Multiple threads using Runnable interface\nclass MyTask implements Runnable {\n    private String taskName;\n\n    MyTask(String taskName) { this.taskName = taskName; }\n\n    public void run() {\n        for (int i = 1; i <= 5; i++) {\n            System.out.println(taskName + \" -> count \" + i);\n            try { Thread.sleep(300); } catch (InterruptedException e) { }\n        }\n        System.out.println(taskName + \" finished\");\n    }\n}\n\npublic class Q05_RunnableThreads {\n    public static void main(String[] args) throws InterruptedException {\n        Thread t1 = new Thread(new MyTask(\"Thread-A\"));\n        Thread t2 = new Thread(new MyTask(\"Thread-B\"));\n        Thread t3 = new Thread(new MyTask(\"Thread-C\"));\n        t1.start(); t2.start(); t3.start();\n        t1.join(); t2.join(); t3.join();\n        System.out.println(\"All threads completed\");\n    }\n}\n", "out": "Thread-B -> count 1\nThread-C -> count 1\nThread-A -> count 1\nThread-C -> count 2\nThread-A -> count 2\nThread-B -> count 2\nThread-A -> count 3\nThread-B -> count 3\nThread-C -> count 3\nThread-B -> count 4\nThread-C -> count 4\nThread-A -> count 4\nThread-C -> count 5\nThread-B -> count 5\nThread-A -> count 5\nThread-C finished\nThread-A finished\nThread-B finished\nAll threads completed"}, {"n": 6, "file": "Q06_StringBufferDemo.java", "cls": "Q06_StringBufferDemo", "title": "StringBuffer methods", "tag": "Console", "code": "// Q6: StringBuffer methods\npublic class Q06_StringBufferDemo {\n    public static void main(String[] args) {\n        StringBuffer sb = new StringBuffer(\"Hello\");\n        System.out.println(\"Original      : \" + sb);\n\n        sb.append(\" World\");\n        System.out.println(\"append()      : \" + sb);\n\n        sb.insert(5, \",\");\n        System.out.println(\"insert()      : \" + sb);\n\n        sb.replace(0, 5, \"Hi\");\n        System.out.println(\"replace()     : \" + sb);\n\n        sb.delete(2, 3);\n        System.out.println(\"delete()      : \" + sb);\n\n        sb.deleteCharAt(sb.length() - 1);\n        System.out.println(\"deleteCharAt(): \" + sb);\n\n        sb.reverse();\n        System.out.println(\"reverse()     : \" + sb);\n\n        System.out.println(\"length()      : \" + sb.length());\n        System.out.println(\"capacity()    : \" + sb.capacity());\n        System.out.println(\"charAt(0)     : \" + sb.charAt(0));\n\n        sb.setCharAt(0, 'X');\n        System.out.println(\"setCharAt()   : \" + sb);\n\n        sb.setLength(3);\n        System.out.println(\"setLength(3)  : \" + sb);\n    }\n}\n", "out": "Original      : Hello\nappend()      : Hello World\ninsert()      : Hello, World\nreplace()     : Hi, World\ndelete()      : Hi World\ndeleteCharAt(): Hi Worl\nreverse()     : lroW iH\nlength()      : 7\ncapacity()    : 21\ncharAt(0)     : l\nsetCharAt()   : XroW iH\nsetLength(3)  : Xro"}, {"n": 7, "file": "Q07_Calculator.java", "cls": "Q07_Calculator", "title": "Calculator using event handling", "tag": "GUI", "code": "// Q7: Simple calculator using event handling (ActionListener)\nimport javax.swing.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\npublic class Q07_Calculator extends JFrame implements ActionListener {\n    JTextField display = new JTextField();\n    double first = 0;\n    String op = \"\";\n    boolean startNew = true;\n\n    Q07_Calculator() {\n        setTitle(\"Calculator\");\n        setSize(300, 400);\n        setLayout(new BorderLayout());\n        display.setFont(new Font(\"Arial\", Font.BOLD, 24));\n        display.setHorizontalAlignment(JTextField.RIGHT);\n        display.setEditable(false);\n        add(display, BorderLayout.NORTH);\n\n        String[] keys = { \"7\", \"8\", \"9\", \"/\", \"4\", \"5\", \"6\", \"*\",\n                          \"1\", \"2\", \"3\", \"-\", \"0\", \".\", \"=\", \"+\", \"C\" };\n        JPanel p = new JPanel(new GridLayout(5, 4, 5, 5));\n        for (String k : keys) {\n            JButton b = new JButton(k);\n            b.setFont(new Font(\"Arial\", Font.BOLD, 18));\n            b.addActionListener(this);\n            p.add(b);\n        }\n        add(p, BorderLayout.CENTER);\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n        setLocationRelativeTo(null);\n        setVisible(true);\n    }\n\n    public void actionPerformed(ActionEvent e) {\n        String c = e.getActionCommand();\n        if (c.matches(\"[0-9.]\")) {\n            if (startNew) { display.setText(\"\"); startNew = false; }\n            display.setText(display.getText() + c);\n        } else if (c.equals(\"C\")) {\n            display.setText(\"\"); first = 0; op = \"\"; startNew = true;\n        } else if (c.equals(\"=\")) {\n            if (!op.isEmpty() && !display.getText().isEmpty()) {\n                double second = Double.parseDouble(display.getText());\n                double res = 0;\n                switch (op) {\n                    case \"+\": res = first + second; break;\n                    case \"-\": res = first - second; break;\n                    case \"*\": res = first * second; break;\n                    case \"/\":\n                        if (second == 0) { display.setText(\"Error\"); startNew = true; op = \"\"; return; }\n                        res = first / second; break;\n                }\n                display.setText(String.valueOf(res));\n                op = \"\"; startNew = true;\n            }\n        } else { // operator\n            if (!display.getText().isEmpty()) {\n                first = Double.parseDouble(display.getText());\n                op = c;\n                startNew = true;\n            }\n        }\n    }\n\n    public static void main(String[] args) {\n        SwingUtilities.invokeLater(Q07_Calculator::new);\n    }\n}\n", "out": "[GUI program] Opens a 300x400 calculator window.\nTry: 12 + 8 = 20.0   |   9 / 0 = Error   |   C clears the display."}, {"n": 8, "file": "Q08_FileWrite.java", "cls": "Q08_FileWrite", "title": "Write student details into a file", "tag": "Console", "code": "// Q8: Create a file and write student details into it\nimport java.io.*;\nimport java.util.Scanner;\n\npublic class Q08_FileWrite {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        System.out.print(\"How many students? \");\n        int n = sc.nextInt();\n        sc.nextLine();\n\n        try (FileWriter fw = new FileWriter(\"students.txt\")) {\n            for (int i = 1; i <= n; i++) {\n                System.out.println(\"Enter details of student \" + i);\n                System.out.print(\"Roll No : \"); String roll = sc.nextLine();\n                System.out.print(\"Name    : \"); String name = sc.nextLine();\n                System.out.print(\"Course  : \"); String course = sc.nextLine();\n                fw.write(roll + \",\" + name + \",\" + course + \"\\n\");\n            }\n            System.out.println(\"Details written to students.txt\");\n        } catch (IOException e) {\n            System.out.println(\"Error: \" + e.getMessage());\n        }\n    }\n}\n", "out": "How many students? 2\nEnter details of student 1\nRoll No : 101\nName    : Arun\nCourse  : BCA\nEnter details of student 2\nRoll No : 102\nName    : Banu\nCourse  : B.Sc CS\nDetails written to students.txt\n\nstudents.txt now contains:\n101,Arun,BCA\n102,Banu,B.Sc CS"}, {"n": 9, "file": "Q09_LoginApp.java", "cls": "Q09_LoginApp", "title": "Swing login with database validation", "tag": "GUI + DB", "code": "// Q9: Swing login application validating against a MySQL database\n// SQL to create the table:\n//   CREATE DATABASE college;\n//   USE college;\n//   CREATE TABLE users(username VARCHAR(30) PRIMARY KEY, password VARCHAR(30));\n//   INSERT INTO users VALUES('admin','admin123');\n// Add mysql-connector-j jar to the classpath.\nimport javax.swing.*;\nimport java.awt.*;\nimport java.sql.*;\n\npublic class Q09_LoginApp extends JFrame {\n    JTextField txtUser = new JTextField(15);\n    JPasswordField txtPass = new JPasswordField(15);\n    JButton btnLogin = new JButton(\"Login\");\n    JLabel lblMsg = new JLabel(\" \", JLabel.CENTER);\n\n    Q09_LoginApp() {\n        setTitle(\"Login\");\n        setSize(320, 220);\n        setLayout(new GridLayout(4, 2, 8, 8));\n        add(new JLabel(\"  Username:\")); add(txtUser);\n        add(new JLabel(\"  Password:\")); add(txtPass);\n        add(new JLabel(\"\")); add(btnLogin);\n        add(lblMsg);\n        btnLogin.addActionListener(e -> login());\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n        setLocationRelativeTo(null);\n        setVisible(true);\n    }\n\n    void login() {\n        String user = txtUser.getText().trim();\n        String pass = new String(txtPass.getPassword());\n        String url = \"jdbc:mysql://localhost:3306/college\";\n        try (Connection con = DriverManager.getConnection(url, \"root\", \"\");\n             PreparedStatement ps = con.prepareStatement(\n                     \"SELECT * FROM users WHERE username=? AND password=?\")) {\n            ps.setString(1, user);\n            ps.setString(2, pass);\n            ResultSet rs = ps.executeQuery();\n            if (rs.next()) {\n                lblMsg.setForeground(new Color(0, 128, 0));\n                lblMsg.setText(\"Login successful\");\n                JOptionPane.showMessageDialog(this, \"Welcome, \" + user + \"!\");\n            } else {\n                lblMsg.setForeground(Color.RED);\n                lblMsg.setText(\"Invalid username or password\");\n            }\n        } catch (SQLException ex) {\n            lblMsg.setForeground(Color.RED);\n
